[package]
name = "tide-core"
description = "Tide core domain: time-varying price grids, auditable rate engine, exact scheduler and its brute-force reference oracle. No I/O, no async, no floats."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# `tide-core` must compile to BOTH `x86_64-unknown-linux-gnu` (where the
# property-test corpus runs at full speed) and `wasm32-unknown-unknown` (where
# the identical arithmetic ships to production). Every dependency below is
# wasm-safe; nothing here pulls in Tokio, threads, or the filesystem.
[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
proptest = "1"

[features]
default = []
