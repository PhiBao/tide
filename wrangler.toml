# Wrangler configuration for Tide.
#
# Tide is a single Cloudflare Worker that serves both the API and the Next.js
# static export, so the app has exactly one origin. That matters for the test
# suite: TestSprite's UI tests run against one URL, and there is no cross-origin
# boundary to produce auth flakiness or CORS false negatives.

name = "tide"
main = "crates/worker/build/index.js"
compatibility_date = "2026-10-09"

# ---------------------------------------------------------------------------
# Previews
#
# Required even when empty. This is what lets `wrangler preview` create a
# branch-scoped deployment, which is how each pull request gets its own URL to
# test. See .github/workflows/ci.yml.
# ---------------------------------------------------------------------------
previews = { }

# ---------------------------------------------------------------------------
# Static assets
#
# The Next.js build output is served through the ASSETS binding. Requests to
# /api/* are handled by the Worker's router; everything else falls through to
# the built frontend. `not_found_handling = "single-page-application"` means a
# deep link like /s/abc resolves to the SPA shell rather than a 404, so a
# shared scenario link always loads.
# ---------------------------------------------------------------------------
[assets]
directory = "./web/out"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# ---------------------------------------------------------------------------
# Observability
#
# Logs are on in production, off in preview, because a preview's logs would be
# dominated by test-suite traffic rather than real users.
# ---------------------------------------------------------------------------
[observability]
enabled = true

[env.preview]
name = "tide-preview"

# Bindings are NOT inherited by an environment, and `wrangler preview` builds a
# branch deployment without them unless it is told to use this file's settings.
# Before either of those was understood, every pull request's preview ran with
# no database: the frontend served fine, the smoke probe passed, and the only
# symptom was two browser tests reporting "persistence is not configured for
# this deployment". That message was true, and it was about the deployment
# rather than the branch.
#
# The CI preview path passes `--ignore-defaults`, which makes it use the
# top-level binding below and write to the production store (partitioned per
# browser session, as everything else is). This block is for invoking the
# environment directly, with `--env preview`, and gives it a database of its
# own so a preview run can never touch real data.
[[env.preview.d1_databases]]
binding = "tide"
database_name = "tide-preview"
database_id = "7c92bb83-3a0a-4afd-9fc0-f09714b0c738"
migrations_dir = "migrations"

[env.preview.observability]
enabled = false

[[d1_databases]]
binding = "tide"
database_name = "tide"
database_id = "cfed1aac-7a4c-42ef-8491-338fabfb0c75"
migrations_dir = "migrations"
