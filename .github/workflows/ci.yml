# Tide's CI pipeline.
#
# This workflow is the product's central promise made mechanical: every pull
# request is deployed to its own Cloudflare preview, smoke-probed, and then
# tested by TestSprite against **that** preview, with the result blocking the
# merge.
#
# Three decisions worth explaining:
#
# 1. The target URL is minted by this workflow, not guessed. TestSprite's
#    GitHub App route needs a URL *pattern* like `{branch}-worker.domain`, but
#    Cloudflare's preview URL is `<preview-name>-<worker>.<subdomain>.workers.dev`
#    where the preview name is the branch — and the branch→DNS-label transform
#    is undocumented, so `feature/login` may or may not become
#    `feature-login-phibao-tide`. Running the test through the CLI with an
#    explicit `--target-url` removes that guesswork entirely.
#
# 2. The preview is named `pr-<number>`, never the branch name. Branch names
#    can contain characters that are illegal in a DNS label, and a 63-character
#    branch would break the preview URL outright. A PR number is always safe.
#
# 3. Credits are spent deliberately. A preview that fails its smoke probe
#    aborts the job before TestSprite is invoked, so a broken deploy costs
#    nothing; and `max-concurrency` is capped so a large suite cannot burn the
#    monthly allowance in a single PR.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A PR's preview is disposable; de-duplicate so a rapid push sequence does not
# queue five runs and spend five suites of credits.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  # -------------------------------------------------------------------------
  # Checks: fmt, clippy, and the full test suite. Fast, offline, and the first
  # thing to fail — a red suite here means no deploy and no credits spent.
  # -------------------------------------------------------------------------
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: workspace

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --tests -- -D warnings

      - name: Test
        run: cargo test --workspace --verbose

  # -------------------------------------------------------------------------
  # Preview: build and deploy this PR to its own Cloudflare preview, then
  # smoke-probe it. Downstream jobs depend on the emitted URL.
  # -------------------------------------------------------------------------
  preview:
    name: Preview
    runs-on: ubuntu-latest
    needs: checks
    # Preview URLs are named after a pull request number, so this job is
    # meaningless on a push to main — `pr-` with an empty number is not a valid
    # DNS label and the mint would fail. Production deployment is a separate
    # concern from the PR gate.
    if: github.event_name == 'pull_request'
    outputs:
      url: ${{ steps.mint.outputs.url }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      # The lockfile lives in web/, so the install has to happen there. Running
      # it from the repo root finds no lockfile and `--frozen-lockfile` fails
      # outright rather than resolving fresh versions.
      - name: Build frontend
        run: pnpm --dir web install --frozen-lockfile && pnpm --dir web build

      # worker-build reads the manifest of the crate it runs in, so it must be
      # invoked from crates/worker. It emits build/index.js + index_bg.wasm,
      # which is what wrangler uploads; a plain `cargo build` would produce only
      # an .rlib and wrangler would find no entry point.
      - name: Build worker
        working-directory: crates/worker
        run: cargo install -q worker-build && worker-build --release

      - name: Mint preview
        id: mint
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: crates/worker
        # A real deployment to a PR-scoped Worker name.
        #
        # A real Worker deploy rather than a Preview deployment, because a
        # Preview deployment does not carry the D1 binding from wrangler.toml --
        # both flags that look like the fix are accepted and neither helps.
        #
        # The three browser tests that need a store still run against
        # production, in their own TestSprite project, beside the API suite.
        # That is a scoping choice rather than a necessity now that this job
        # deploys properly: it keeps the gate fast and exercises storage against
        # a real deployment. Everything here is a test a preview can host.
        #
        # The URL is scraped rather than parsed from JSON because `wrangler
        # deploy` has no --json output. Each PR leaves one Worker behind
        # (pr-N-tide); they are cheap and are removed when the PR is closed by
        # hand. Worth automating, and not worth a step that can fail.
        run: |
          set -o pipefail
          name="pr-${{ github.event.pull_request.number }}-tide"
          if ! raw="$(npx wrangler deploy --name "$name" 2>&1)"; then
            printf '%s\n' "$raw"
            echo "::error title=Preview failed::wrangler could not deploy a preview for this PR."
            echo "::error::CLOUDFLARE_API_TOKEN must be an Account API token with the"\
                  "'Edit Cloudflare Workers' permission, scoped to this account."
            exit 1
          fi
          printf '%s\n' "$raw"
          url="$(printf '%s\n' "$raw" | grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' | head -1)"
          if [ -z "$url" ]; then
            echo "::error title=Preview URL unreadable::wrangler succeeded but printed no"\
                 "workers.dev URL, so the output shape has changed."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Smoke probe
        env:
          URL: ${{ steps.mint.outputs.url }}
        # If the probe fails the job stops here and TestSprite is never invoked,
        # so a broken deploy costs no credits.
        run: |
          for attempt in 1 2 3 4 5; do
            if curl --fail --show-error --silent "$URL/api/health" > /tmp/health.json; then
              cat /tmp/health.json
              test "$(jq -r .status /tmp/health.json)" = "ok" && exit 0
            fi
            echo "probe attempt $attempt failed; retrying in 5s"
            sleep 5
          done
          echo "preview did not become healthy" >&2
          exit 1

  # -------------------------------------------------------------------------
  # TestSprite: run the suite against this PR's preview. This is the blocking
  # check; branch protection marks it required.
  # -------------------------------------------------------------------------
  testsprite:
    name: TestSprite
    runs-on: ubuntu-latest
    needs: preview
    # Runs against the PR's own preview, so it is a PR-only job by construction.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install TestSprite CLI
        run: npm install -g @testsprite/testsprite-cli

      # The suite that runs must be the suite this repository describes. Both
      # copies drifted once -- a fix landed here while the portal kept running
      # the old code -- and the only symptom was a red run whose reported cause
      # was not the real one. So the check is part of the gate: a pull request
      # that edits a test without sending the edit on fails here, before the
      # suite runs, rather than reporting a green run about code that never
      # executed.
      - name: Prove the suite here is the suite that runs
        env:
          TESTSPRITE_API_KEY: ${{ secrets.TESTSPRITE_API_KEY }}
        run: python3 scripts/suite-sync.py

      # A suite that did not run is not a suite that passed, so this fails rather
      # than skipping. But it fails with the reason named, because the
      # alternative is an opaque exit code 12 several layers down -- and a red
      # nobody can read is how a team learns to ignore red.
      - name: Check the credit balance
        env:
          TESTSPRITE_API_KEY: ${{ secrets.TESTSPRITE_API_KEY }}
          NEEDED: 16
        run: |
          available="$(testsprite --output json credits 2>/dev/null | jq -r '.activeOrg.remaining // empty')"
          if [ -z "$available" ]; then
            echo "::error title=Credit check failed::could not read the balance; treating as unknown rather than affordable."
            exit 1
          fi
          echo "TestSprite credits available: $available; this suite needs about $NEEDED"
          if ! awk -v a="$available" -v n="$NEEDED" 'BEGIN { exit !(a >= n) }'; then
            echo "::error title=Out of TestSprite credits::$available available, about $NEEDED needed. The suite cannot run, so this check is red rather than green -- it did not pass, it did not happen. Top up at https://www.testsprite.com/pricing"
            exit 1
          fi

      - name: Run suite against the preview
        env:
          TESTSPRITE_API_KEY: ${{ secrets.TESTSPRITE_API_KEY }}
          PREVIEW_URL: ${{ needs.preview.outputs.url }}
          PROJECT_ID: ${{ secrets.TESTSPRITE_PROJECT_ID }}
        # `--target-url` creates a temporary environment for this run and
        # deletes it afterwards, so concurrent PRs never collide and no
        # environment budget is consumed.
        #
        # Two at a time, not five. This app re-solves its schedule on every
        # interaction -- an optimiser with a certificate, on each click -- and
        # four concurrent cold browser sessions saturate one isolate. The
        # symptom was two tests failing on every run, always the two that edit a
        # load and wait for the answer to change, while both passed in isolation
        # against the very same preview. The gate was measuring its own
        # contention rather than the branch. At 600s the same lesson was a
        # timeout that 900s removed.
        #
        # Auto-heal is deliberately NOT disabled here. A frontend test is
        # executed by an agent against its plan, and the agent re-authors the
        # generated selectors when it finds them stale; 12 of these 34 tests cannot
        # replay verbatim at all, because their generated code names elements the
        # application does not have, or selects empty option values. Committing that code as the contract was a mistake this
        # repository has since corrected: tests/ui/ holds the plans, which are
        # what this gate is accountable to. The trade-off is stated in the
        # README rather than hidden: a healed test can pass over a regression,
        # which is why the exact assertions live in the API suite, where the
        # code is authored and runs strict.
        run: |
          set -o pipefail
          testsprite test run --all \
            --project "$PROJECT_ID" \
            --target-url "$PREVIEW_URL" \
            --wait \
            --max-concurrency 2 \
            --timeout 900 \
            --output json \
            --report junit --report-file ./testsprite-junit.xml \
            --summary-file ./testsprite-summary.json \
            > result.json

      - name: Report
        if: always()
        run: |
          echo "## TestSprite" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Target: $PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`json" >> "$GITHUB_STEP_SUMMARY"
          cat testsprite-summary.json 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || echo "(no summary)" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: testsprite-junit-pr${{ github.event.pull_request.number }}
          path: testsprite-junit.xml
          if-no-files-found: warn

      - name: Capture the failure bundle
        # One self-consistent bundle, so a coding agent can read exactly what
        # broke without stitching together artefacts from two different runs.
        if: failure()
        run: |
          testsprite test failure get \
            "$(jq -r '.run.testId // empty' result.json)" \
            --out ./.testsprite/failure || true
          ls -R .testsprite 2>/dev/null || true

  # -------------------------------------------------------------------------
  # Deploy: keep the public URL current with main.
  #
  # The judges are told to open the live URL, so it has to reflect main rather
  # than whatever was last deployed by hand. This runs only on a push to main,
  # after the same checks that gate every PR.
  # -------------------------------------------------------------------------
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Build frontend
        run: pnpm --dir web install --frozen-lockfile && pnpm --dir web build

      - name: Build worker
        working-directory: crates/worker
        run: cargo install -q worker-build && worker-build --release

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Verify the deployment answers
        run: |
          for attempt in 1 2 3 4 5; do
            if curl --fail --show-error --silent "$URL/api/health" > /tmp/health.json; then
              cat /tmp/health.json
              test "$(jq -r .status /tmp/health.json)" = "ok" && exit 0
            fi
            echo "probe attempt $attempt failed; retrying in 5s"
            sleep 5
          done
          echo "production did not become healthy" >&2
          exit 1
        env:
          URL: https://tide.kiter0211.workers.dev

  # -------------------------------------------------------------------------
  # API contract suite.
  #
  # This runs against PRODUCTION, after the deploy, and only on main. That is a
  # deliberate limitation, not an oversight:
  #
  # `--target-url` is silently ignored for backend projects — verified by
  # pointing it at a URL that does not serve this API and watching all 18 tests
  # still pass. And the Starter plan allows exactly one TestSprite environment,
  # so per-PR environment names are not available either. Wiring the backend
  # suite into the PR gate with `--target-url` would therefore produce a green
  # check that proves nothing about the pull request.
  #
  # The per-PR gate is the frontend suite, which does honour `--target-url` and
  # tests the branch's own preview. This suite is the API contract: 18 tests
  # asserting exact micro-dollar totals against the deployed service.
  # -------------------------------------------------------------------------
  api-contract:
    name: API Contract
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      # Needed now that the suite is committed here: the sync check below reads
      # it from the working tree rather than trusting the portal.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install TestSprite CLI
        run: npm install -g @testsprite/testsprite-cli

      # Same check as the per-PR gate, for the same reason: a red suite is only
      # evidence if the suite that ran is the one committed here.
      - name: Prove the suite here is the suite that runs
        env:
          TESTSPRITE_API_KEY: ${{ secrets.TESTSPRITE_API_KEY }}
        run: python3 scripts/suite-sync.py

      # A suite that did not run is not a suite that passed, so this fails rather
      # than skipping. But it fails with the reason named, because the
      # alternative is an opaque exit code 12 several layers down -- and a red
      # nobody can read is how a team learns to ignore red.
      - name: Check the credit balance
        env:
          TESTSPRITE_API_KEY: ${{ secrets.TESTSPRITE_API_KEY }}
          NEEDED: 6
        run: |
          available="$(testsprite --output json credits 2>/dev/null | jq -r '.activeOrg.remaining // empty')"
          if [ -z "$available" ]; then
            echo "::error title=Credit check failed::could not read the balance; treating as unknown rather than affordable."
            exit 1
          fi
          echo "TestSprite credits available: $available; this suite needs about $NEEDED"
          if ! awk -v a="$available" -v n="$NEEDED" 'BEGIN { exit !(a >= n) }'; then
            echo "::error title=Out of TestSprite credits::$available available, about $NEEDED needed. The suite cannot run, so this check is red rather than green -- it did not pass, it did not happen. Top up at https://www.testsprite.com/pricing"
            exit 1
          fi

      - name: Run the API contract suite against production
        env:
          TESTSPRITE_API_KEY: ${{ secrets.TESTSPRITE_API_KEY }}
          API_PROJECT_ID: ${{ secrets.TESTSPRITE_API_PROJECT_ID }}
          PRODUCTION_URL: https://tide.kiter0211.workers.dev
        run: |
          set -o pipefail
          testsprite test run --all \
            --project "$API_PROJECT_ID" \
            --no-auto-heal \
            --wait \
            --max-concurrency 4 \
            --timeout 900 \
            --output json \
            --report junit --report-file ./api-junit.xml \
            --summary-file ./api-summary.json \
            > api-result.json
          cat api-summary.json

      - name: Run the storage browser suite against production
        env:
          TESTSPRITE_API_KEY: ${{ secrets.TESTSPRITE_API_KEY }}
        # Production-scoped for the same reason the API suite is: a Preview
        # deployment carries no D1 binding, so a preview cannot answer
        # /api/history/* at all and these three tests would block there on every
        # pull request. The id is not a secret -- it is in tests/suite.json.
        run: |
          set -o pipefail
          testsprite test run --all \
            --project a54cd337-26cc-49ad-b0bf-cc7df4380665 \
            --wait --max-concurrency 3 --timeout 900

      - name: Summarise
        if: always()
        run: |
          total=$(jq -r .total api-summary.json 2>/dev/null || echo "?")
          passed=$(jq -r .passed api-summary.json 2>/dev/null || echo "?")
          failed=$(jq -r .failed api-summary.json 2>/dev/null || echo "?")
          {
            echo "## API contract suite"
            echo ""
            echo "Against $PRODUCTION_URL, after deployment."
            echo ""
            echo "**$passed / $total** passed, $failed failed."
            echo ""
            echo "This job is scoped to production on purpose. The per-PR gate is the"
            echo "TestSprite job, which tests the branch's own preview; --target-url is"
            echo "silently ignored for backend projects, so a backend gate here would prove"
            echo "nothing about the pull request."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-contract-junit
          path: api-junit.xml
          if-no-files-found: warn
